name: Daily invoice reminders

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore WhatsApp session
        env:
          WHATSAPP_SESSION_BASE64: ${{ secrets.WHATSAPP_SESSION_BASE64 }}
        run: |
          if [ -z "$WHATSAPP_SESSION_BASE64" ]; then
            echo "::warning::WHATSAPP_SESSION_BASE64 is not configured; WhatsApp reminders will be skipped."
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';

          const encodedSession = process.env.WHATSAPP_SESSION_BASE64;
          if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encodedSession)) {
            throw new Error('WHATSAPP_SESSION_BASE64 must be valid base64.');
          }

          const contents = Buffer.from(encodedSession, 'base64');
          JSON.parse(contents.toString('utf8'));

          const authDirectory = resolve('auth_info_baileys');
          mkdirSync(authDirectory, { recursive: true, mode: 0o700 });
          writeFileSync(resolve(authDirectory, 'creds.json'), contents, { mode: 0o600 });

          console.log('Restored WhatsApp credentials.');
          NODE

      - name: Run reminder engine
        run: node reminderEngine.js
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_PASS }}
