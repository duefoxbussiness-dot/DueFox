name: Daily invoice reminders

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore WhatsApp session
        env:
          WHATSAPP_SESSION_BASE64: ${{ secrets.WHATSAPP_SESSION_BASE64 }}
        run: |
          if [ -z "$WHATSAPP_SESSION_BASE64" ]; then
            echo "::warning::WHATSAPP_SESSION_BASE64 is not configured; WhatsApp reminders will be skipped."
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';

          const encodedSession = process.env.WHATSAPP_SESSION_BASE64;
          if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encodedSession)) {
            throw new Error('WHATSAPP_SESSION_BASE64 must be valid base64.');
          }

          const session = JSON.parse(Buffer.from(encodedSession, 'base64').toString('utf8'));
          if (!session || Array.isArray(session) || typeof session !== 'object' || !session['creds.json']) {
            throw new Error('The decoded WhatsApp session must be a JSON object containing creds.json.');
          }

          const authDirectory = resolve('auth_info_baileys');
          mkdirSync(authDirectory, { recursive: true, mode: 0o700 });
          for (const [filename, encodedContents] of Object.entries(session)) {
            if (!/^[A-Za-z0-9._-]+\.json$/.test(filename) || filename === '.' || filename === '..') {
              throw new Error(`Invalid WhatsApp session filename: ${filename}`);
            }
            if (typeof encodedContents !== 'string' || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encodedContents)) {
              throw new Error(`Invalid base64 session contents for ${filename}.`);
            }

            const contents = Buffer.from(encodedContents, 'base64');
            JSON.parse(contents.toString('utf8'));
            writeFileSync(resolve(authDirectory, filename), contents, { mode: 0o600 });
          }

          console.log(`Restored ${Object.keys(session).length} WhatsApp session files.`);
          NODE

      - name: Run reminder engine
        run: node reminderEngine.js
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_PASS }}
